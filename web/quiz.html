<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quiz ôn bài</title>
<style>
  :root {
    --bg: #fafaf7; --fg: #1b1b18; --muted: #5b5b54; --card: #ffffff; --line: #cfcfc6;
    --accent: #1f5fbf; --accent-fg: #ffffff; --ok: #1b6b2f; --ok-bg: #e3f4e7; --bad: #a3231b; --bad-bg: #fbe6e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151512; --fg: #f1f0ea; --muted: #b0afa5; --card: #1f1f1b; --line: #3d3d36;
      --accent: #7ab0ff; --accent-fg: #0b1b33; --ok: #7fdc95; --ok-bg: #16301d; --bad: #ff9c94; --bad-bg: #3a1b18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  h2 { font-size: 1.2rem; margin: 20px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  button, .btn { display: block; width: 100%; min-height: 56px; margin: 8px 0; padding: 12px 16px; text-align: left;
    font: inherit; color: var(--fg); background: var(--card); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
  button:focus-visible, .btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); text-align: center; font-weight: 600; }
  button.correct { border-color: var(--ok); background: var(--ok-bg); }
  button.wrong { border-color: var(--bad); background: var(--bad-bg); }
  button:disabled { cursor: default; opacity: 1; }
  .btn { text-align: center; }
  .btn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0 16px; }
  .progress > span { display: block; height: 100%; background: var(--accent); }
  .verdict { font-weight: 700; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
  .quote { border-left: 4px solid var(--line); padding-left: 12px; margin: 8px 0; font-style: italic; }
  .notice { border: 2px solid var(--bad); background: var(--bad-bg); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .done { border: 2px solid var(--ok); background: var(--ok-bg); border-radius: 12px; padding: 12px 16px; margin: 12px 0; font-weight: 700; }
  .score { font-size: 2.2rem; font-weight: 800; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="grade.js"></script>
<script>
(function () {
  "use strict";
  var G = window.StudyGrade;
  var app = document.getElementById("app");

  // ---- Lưu trữ: localStorage có thể lỗi hoặc rỗng nên luôn có bộ nhớ tạm dự phòng ----
  var memory = {};
  function storeGet(key) {
    try { var v = window.localStorage.getItem(key); if (v !== null) return v; } catch (e) { /* bị chặn */ }
    return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
  }
  function storeSet(key, value) {
    memory[key] = value;
    try { window.localStorage.setItem(key, value); } catch (e) { /* chỉ còn bộ nhớ tạm */ }
  }
  function resultKey(date, id) { return "study-agent.result." + date + "." + id; }
  function doneKey(date) { return "study-agent.done." + date; }
  function readResult(date, id) {
    try { return JSON.parse(storeGet(resultKey(date, id)) || "null"); } catch (e) { return null; }
  }
  function allResults(state) {
    var out = {};
    (state.today.quizzes || []).forEach(function (file) {
      var id = G.courseIdFromFile(file);
      var r = id === null ? null : readResult(state.date, id);
      if (r) out[id] = r;
    });
    return out;
  }

  // ---- DOM: chỉ dùng textContent, không dùng innerHTML ----
  function el(tag, text, cls, attrs) {
    var node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = text;
    if (cls) node.className = cls;
    if (attrs) Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }
  function show() {
    app.replaceChildren.apply(app, arguments);
    window.scrollTo(0, 0);
  }
  function localDate() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  var state = null;     // { today, date, quizzes: {tên file: quiz}, missing: [], problems: [] }
  var session = null;   // { quiz, file, questions, index, answers, picked }

  // ---- Màn hình 1: chọn file ----
  function renderLoad(problems) {
    var input = el("input", null, null, { type: "file", multiple: "multiple", accept: ".json,application/json", id: "file-input" });
    input.addEventListener("change", function () { loadFiles(Array.prototype.slice.call(input.files)); });
    var label = el("label", null, "btn primary");
    label.appendChild(el("span", "Chọn file"));
    label.appendChild(input);
    var nodes = [
      el("h1", "Quiz ôn bài"),
      el("p", "Chọn file today.json cùng các file quiz-*.json (chọn được từ Google Drive).", "muted"),
      label,
    ];
    if (problems && problems.length) {
      var box = el("div", null, "notice", { role: "alert" });
      problems.forEach(function (p) { box.appendChild(el("p", p)); });
      nodes.push(box);
    }
    show.apply(null, nodes);
  }

  function readFile(file) {
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function () { resolve({ name: file.name, text: String(reader.result) }); };
      reader.onerror = function () { resolve({ name: file.name, error: "không đọc được file" }); };
      reader.readAsText(file, "utf-8");
    });
  }

  function loadFiles(files) {
    if (!files.length) return;
    Promise.all(files.map(readFile)).then(function (read) {
      var problems = [];
      var today = null;
      var quizzes = {};
      read.forEach(function (f) {
        if (f.error) { problems.push(f.name + ": " + f.error); return; }
        var data;
        try { data = JSON.parse(f.text); } catch (e) { problems.push(f.name + ": không phải JSON hợp lệ"); return; }
        if (data && Array.isArray(data.quizzes)) { today = data; return; }
        var check = G.validateQuizShape(data);
        if (!check.ok) { problems.push(f.name + ": " + check.error); return; }
        quizzes[f.name] = data;
      });
      if (!today) {
        today = { date: localDate(), quizzes: Object.keys(quizzes).sort() };
      }
      var missing = today.quizzes.filter(function (name) { return !Object.prototype.hasOwnProperty.call(quizzes, name); });
      if (!Object.keys(quizzes).length) {
        problems.push("Chưa có file quiz hợp lệ nào." + (missing.length ? " Còn thiếu: " + missing.join(", ") : ""));
        renderLoad(problems);
        return;
      }
      state = { today: today, date: today.date || localDate(), quizzes: quizzes, missing: missing, problems: problems };
      renderList();
    });
  }

  // ---- Màn hình 2: danh sách quiz của hôm nay ----
  function renderList() {
    var nodes = [el("h1", "Quiz hôm nay (" + state.date + ")")];
    if (state.missing.length) {
      var box = el("div", null, "notice", { role: "alert" });
      box.appendChild(el("p", "Còn thiếu file: " + state.missing.join(", ") + ". Hãy chọn thêm các file này."));
      var again = el("button", "Chọn lại file", "primary");
      again.addEventListener("click", function () { renderLoad(); });
      box.appendChild(again);
      nodes.push(box);
    }
    if (state.problems.length) {
      var pb = el("div", null, "notice", { role: "alert" });
      state.problems.forEach(function (p) { pb.appendChild(el("p", p)); });
      nodes.push(pb);
    }
    var results = allResults(state);
    var status = G.dayStatus(state.today, results);
    if (status.done) nodes.push(el("div", "Hôm nay đã xong", "done"));
    Object.keys(state.quizzes).sort().forEach(function (file) {
      var quiz = state.quizzes[file];
      var r = readResult(state.date, quiz.course_id);
      var btn = el("button", null, null);
      btn.appendChild(el("strong", quiz.course + " · " + quiz.topic));
      var info = r ? (r.passed ? "✓ Đã đạt (" : "✗ Chưa đạt (") + Math.round(r.ratio * 100) + "%)" : "Chưa làm";
      btn.appendChild(el("div", quiz.questions.length + " câu · " + info, "muted"));
      btn.addEventListener("click", function () { startQuiz(file); });
      nodes.push(btn);
    });
    show.apply(null, nodes);
  }

  // ---- Màn hình 3: làm bài ----
  function startQuiz(file) {
    var quiz = state.quizzes[file];
    session = {
      quiz: quiz, file: file, index: 0, answers: {}, picked: null,
      questions: quiz.questions.map(function (q) { return G.shuffleQuestion(q); }),
    };
    renderQuestion();
  }

  function renderQuestion() {
    var q = session.questions[session.index];
    var total = session.questions.length;
    var bar = el("div", null, "progress");
    var fill = el("span");
    fill.style.width = Math.round((session.index / total) * 100) + "%";
    bar.appendChild(fill);
    var nodes = [
      el("p", session.quiz.course + " · " + session.quiz.topic, "muted"),
      el("p", "Câu " + (session.index + 1) + " / " + total, "muted"),
      bar,
      el("h1", q.question),
    ];
    var buttons = [];
    q.options.forEach(function (text, i) {
      var b = el("button", String.fromCharCode(65 + i) + ". " + text);
      b.addEventListener("click", function () { choose(i, buttons, q); });
      buttons.push(b);
      nodes.push(b);
    });
    var feedback = el("div", null, null, { id: "feedback" });
    nodes.push(feedback);
    session.feedback = feedback;
    show.apply(null, nodes);
  }

  function choose(i, buttons, q) {
    if (session.picked !== null) return;
    session.picked = i;
    session.answers[q.id] = i;
    buttons.forEach(function (b, idx) {
      b.disabled = true;
      if (idx === q.answer_index) { b.classList.add("correct"); b.textContent = "✓ " + b.textContent; }
      else if (idx === i) { b.classList.add("wrong"); b.textContent = "✗ " + b.textContent; }
    });
    var ok = i === q.answer_index;
    var fb = session.feedback;
    var card = el("div", null, "card");
    card.appendChild(el("p", ok ? "Đúng rồi" : "Sai rồi", "verdict " + (ok ? "ok" : "bad")));
    if (!ok) card.appendChild(el("p", "Đáp án đúng: " + String.fromCharCode(65 + q.answer_index) + ". " + q.options[q.answer_index]));
    card.appendChild(el("p", q.explanation));
    card.appendChild(el("p", q.source.quote, "quote"));
    card.appendChild(el("p", "Nguồn: " + q.source.file, "muted"));
    var last = session.index === session.questions.length - 1;
    var next = el("button", last ? "Xem kết quả" : "Câu tiếp", "primary");
    next.addEventListener("click", function () {
      session.picked = null;
      if (last) renderResult(); else { session.index += 1; renderQuestion(); }
    });
    fb.appendChild(card);
    fb.appendChild(next);
    next.focus();
  }

  // ---- Màn hình 4: kết quả ----
  function renderResult() {
    var quiz = session.quiz;
    var r = G.grade({ pass_ratio: quiz.pass_ratio, questions: session.questions }, session.answers); // đã xáo nên chấm theo thứ tự đang hiển thị
    var previous = readResult(state.date, quiz.course_id);
    if (!(previous && previous.passed && !r.passed)) { // không để lần làm lại hỏng ghi đè kết quả đã đạt
      storeSet(resultKey(state.date, quiz.course_id), JSON.stringify({ ratio: r.ratio, passed: r.passed, at: new Date().toISOString() }));
    }
    var status = G.dayStatus(state.today, allResults(state));
    if (status.done) storeSet(doneKey(state.date), "1");

    var nodes = [
      el("h1", quiz.course + " · " + quiz.topic),
      el("div", r.correct + " / " + r.total, "score"),
      el("p", "Đạt " + Math.round(r.ratio * 100) + "%, yêu cầu tối thiểu " + Math.round(quiz.pass_ratio * 100) + "%. " +
        (r.passed ? "Bạn đã đạt." : "Chưa đạt, hãy xem lại các câu sai rồi làm lại."), "verdict " + (r.passed ? "ok" : "bad")),
    ];
    if (status.done) nodes.push(el("div", "Hôm nay đã xong", "done"));
    if (r.wrong.length) {
      nodes.push(el("h2", "Các câu cần xem lại"));
      session.questions.filter(function (q) { return r.wrong.indexOf(q.id) !== -1; }).forEach(function (q) {
        var card = el("div", null, "card");
        card.appendChild(el("p", q.question, "verdict"));
        card.appendChild(el("p", "Đáp án đúng: " + q.options[q.answer_index]));
        card.appendChild(el("p", q.explanation));
        card.appendChild(el("p", q.source.quote, "quote"));
        card.appendChild(el("p", "Nguồn: " + q.source.file, "muted"));
        nodes.push(card);
      });
    }
    var retry = el("button", "Làm lại", "primary");
    retry.addEventListener("click", function () { startQuiz(session.file); });
    var back = el("button", "Về danh sách", null);
    back.addEventListener("click", renderList);
    nodes.push(retry, back);
    show.apply(null, nodes);
  }

  renderLoad();
})();
</script>
</body>
</html>
