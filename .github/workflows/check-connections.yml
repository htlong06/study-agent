name: Kiểm tra kết nối

# Chạy tay: tab Actions → "Kiểm tra kết nối" → Run workflow.
# Chỉ đọc dữ liệu Canvas; ghi một file thử vào thư mục StudyAgent trên Drive;
# tạo rồi xóa ngay một sự kiện thử trong Calendar. Không in khoá hay token.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-connections
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kiểm tra kết nối
        run: python tools/check_connections.py --require canvas,gemini,drive,calendar --write-calendar
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
